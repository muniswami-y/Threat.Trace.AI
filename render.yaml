services:
  - type: web
    name: threattrace-api
    runtime: python
    rootDir: ThreatTraceAI/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: DEMO_MODE
        value: true
