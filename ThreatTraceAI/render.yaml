services:
  - type: web
    name: threattrace-backend
    runtime: python
    region: singapore
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "True"
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./threattrace.db
      - key: SECRET_KEY
        generateValue: true
